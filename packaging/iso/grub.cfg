set default="0"
set timeout=3

set menu_color_normal=light-gray/black
set menu_color_highlight=cyan/black

insmod efi_gop
insmod efi_uga
insmod font
insmod gfxterm
terminal_output gfxterm

menuentry "EVAH OS (Bootable Live Desktop - Default)" --class gnu-linux --class os {
    linux /boot/vmlinuz boot=live components quiet splash nomodeset=0 evah.autostart=1
    initrd /boot/initrd.img
}

menuentry "EVAH OS (Safe Graphics Mode - Nomodeset)" --class gnu-linux --class os {
    linux /boot/vmlinuz boot=live components nomodeset vga=normal evah.autostart=1
    initrd /boot/initrd.img
}

menuentry "EVAH OS (Persistent Data Mode - USB Storage)" --class gnu-linux --class os {
    linux /boot/vmlinuz boot=live persistence components quiet splash evah.autostart=1
    initrd /boot/initrd.img
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off System" {
    halt
}
