<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="evah-grad-a" x1="16" y1="20" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="evah-grad-inner" x1="40" y1="40" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Outer shield / hexagonal aperture container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0F172A" stroke="url(#evah-grad-a)" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Geometric Prism / Portal Node: Three interlaced facets -->
  <!-- Top facet -->
  <path d="M64 24 L98 44 L64 64 L30 44 Z" fill="url(#evah-grad-a)" fill-opacity="0.9" />
  <!-- Left facet -->
  <path d="M30 48 L60 66 L60 102 L30 84 Z" fill="#0D9488" fill-opacity="0.85" />
  <!-- Right facet -->
  <path d="M68 66 L98 48 L98 84 L68 102 Z" fill="#2563EB" fill-opacity="0.8" />
  
  <!-- Central core beacon dot -->
  <circle cx="64" cy="64" r="7" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="14" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
</svg>
